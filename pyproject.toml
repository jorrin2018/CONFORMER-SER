[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conformer-ser"
version = "5.1.1"
description = "CAMF: Conflict-Aware Multimodal Fusion for Speech Emotion Recognition on IEMOCAP"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Jorge Luis Jorrin" }]
keywords = [
    "speech-emotion-recognition",
    "multimodal",
    "iemocap",
    "pytorch",
    "transformers",
    "cross-attention",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "torchaudio",
    "transformers",
    "numpy",
    "pandas",
    "scikit-learn",
    "PyYAML",
    "tqdm",
    "matplotlib",
    "seaborn",
    "tensorboard",
]

[project.optional-dependencies]
# Encoder Emotion2Vec (estudios de ablación 50 y 57)
emotion2vec = ["funasr"]
dev = ["black", "flake8", "mypy", "pytest"]

[project.urls]
Repository = "https://github.com/jorrin2018/CONFORMER-SER"

[tool.setuptools.packages.find]
where = ["src"]

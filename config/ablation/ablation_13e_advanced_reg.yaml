# Ablation Study 13e (Study 18): Advanced Regularization version of Ablation 13d
# Base conceptual: Ablation 13d (High Regularization)
# Modificaciones vs Ablation 13d:
#   - model.hidden_dim: 192 (antes 256) -> Menor complejidad del modelo
#   - model.audio_unfreeze_last_n_layers: 4 (antes 6) -> Menos capas descongeladas
#   - model.text_unfreeze_last_n_layers: 3 (antes 4) -> Menos capas descongeladas
#   - training.learning_rate_fusion: 3.0e-6 (antes 5.0e-6) -> LR más conservador
#   - training.max_grad_norm: 0.5 (antes 1.0) -> Gradient clipping más estricto
#   - training.scheduler_patience: 2 (antes 3) -> Reducción de LR más rápida
#   - text.augmentation.mask_prob: 0.2 (antes 0.15) -> Más data augmentation
#   - audio.augmentation.noise_prob: 0.4 (antes 0.3) -> Más data augmentation
#
# Objetivo: Reducir aún más el sobreajuste mediante menor complejidad del modelo,
# menos parámetros entrenables, y regularización más agresiva.

dataset:
  data_path: "F:\\DOCTORADO\\DATASETS\\EMOTION\\IEMOCAP\\archive\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: false
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.4   # AUMENTADO (antes 0.3)
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.2   # AUMENTADO (antes 0.15)
    insert_prob: 0.1
  # Prompts internos de prosodia activados
  use_prosody_cues: true

model:
  # Encoders audio/text
  freeze_audio_encoder: false
  audio_unfreeze_last_n_layers: 4  # REDUCIDO (antes 6)
  freeze_text_encoder: false
  text_unfreeze_last_n_layers: 3   # REDUCIDO (antes 4)

  # Cabeza de clasificación LSTM
  classification_head_type: "lstm"
  lstm_num_layers: 2
  lstm_bidirectional: true

  # Backbones base
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  hidden_dim: 192   # REDUCIDO (antes 256)
  dropout: 0.5
  num_classes: 4

  # Fusión trimodal basada en cross-attention
  fusion_type: "cross_attention"
  fusion_num_heads: 4

  # Rama visual (Mel-espectrograma -> imagen -> ViT)
  vision_encoder: "google/vit-base-patch16-224"
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0  # CONGELADO (igual que 13d)
  vision_image_size: 224

  # Parámetros de mel específicos para la rama visual
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  learning_rate_audio: 3.0e-7
  learning_rate_text: 1.5e-6
  learning_rate_fusion: 3.0e-6  # REDUCIDO (antes 5.0e-6)

  batch_size: 2
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  weight_decay: 0.1
  adam_epsilon: 1.0e-8
  max_grad_norm: 0.5   # REDUCIDO (antes 1.0)

  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1

  warmup_ratio: 0.1
  scheduler_type: "plateau"
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 2   # REDUCIDO (antes 3)
  scheduler_threshold: 1.0e-4
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

  early_stopping_patience: 15
  save_top_k: 3

evaluation:
  batch_size: 4

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42

logging:
  log_dir: "./logs/ablation_13e"
  checkpoint_dir: "./checkpoints/ablation_13e"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-13e"



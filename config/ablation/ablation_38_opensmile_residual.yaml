# Ablation Study 38: OpenSMILE + Attention Gates + Residual Connections
# Base: Ablation 34 (Conflict-Aware Cross-Attention)
# Modificaciones:
#   - Rama OpenSMILE para características de bajo nivel (eGeMAPSv02, 88 features)
#   - Attention-based gates para filtrar características importantes
#   - Cross-attention fusion entre Wav2Vec2 y OpenSMILE antes de la fusión modal
#   - Conexiones residuales en puntos clave para conservar contexto
#   - Técnicas de regularización mejoradas

dataset:
  data_path: "F:\\DOCTORADO\\DATASETS\\EMOTION\\IEMOCAP\\archive\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: false
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  freeze_audio_encoder: false
  audio_unfreeze_last_n_layers: 6
  freeze_text_encoder: true
  text_unfreeze_last_n_layers: 4

  classification_head_type: "lstm"
  lstm_num_layers: 2
  lstm_bidirectional: true

  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  hidden_dim: 384
  dropout: 0.3  # Reducido de 0.5 para evitar colapso de clases
  num_classes: 4
  
  # Optimizaciones para RTX 4060 (8GB VRAM)
  gradient_checkpointing: true  # Ahorra ~60% VRAM sacrificando ~20% velocidad
  use_flash_attention: true  # FlashAttention-2 para reducir accesos a VRAM (requiere xformers)
  use_torch_compile: false  # torch.compile para fusionar kernels (requiere triton)
  # Para habilitar: pip install triton
  # Documentación: https://triton-lang.org/main/getting-started/installation.html
  compile_mode: "reduce-overhead"  # Modo de compilación (solo si use_torch_compile: true)

  fusion_type: "conflict_aware_cross_attention"
  fusion_num_heads: 4
  fusion_num_layers: 3

  # Conflict detection: prediction_divergence | feature_distance | learned
  # - prediction_divergence: conflict when 2+ modalities disagree on predicted class
  # - feature_distance: conflict when mean cosine distance between embeddings > threshold
  # - learned: small MLP predicts conflict from concatenated embeddings
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"

  # OpenSMILE configuration
  opensmile:
    enabled: true
    config: "eGeMAPSv02"
    feature_dim: 88
    normalize: true

  # Attention gates configuration
  attention_gates:
    type: "attention"  # Options: "attention" or "importance"
    num_heads: 4
    dropout: 0.3
    use_layer_norm: true
    temperature: 1.0
    hidden_dim: null  # Only used for "importance" type

  # Audio fusion configuration (Wav2Vec2 + OpenSMILE)
  audio_fusion:
    num_heads: 4
    dropout: 0.3
    use_residual: true
    residual_alpha: 0.2

  # Residual connections configuration
  residual_connections:
    enabled: true
    alpha: 0.2  # Weight for residual connections (0-1)

  vision_encoder: "google/vit-base-patch16-224"
  freeze_vision_encoder: false
  vision_unfreeze_last_n_layers: 6
  vision_image_size: 224

  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  learning_rate_audio: 3.0e-7
  learning_rate_text: 1.5e-6
  learning_rate_fusion: 5.0e-6

  batch_size: 2  # Pequeño por limitación de 8GB VRAM
  num_epochs: 100
  gradient_accumulation_steps: 8  # Simula batch_size efectivo de 16
  mixed_precision: "bf16"  # BFloat16: mejor que FP16, no requiere Loss Scaling
  # Opciones: false, "fp16", "bf16", "fp8" (requiere transformer_engine)
  use_8bit_optimizer: true  # bitsandbytes AdamW8bit: reduce 75% memoria optimizador
  weight_decay: 0.05  # Reducido de 0.1 para evitar sobre-regularización
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  use_loss_scaling: false  # No necesario con BF16

  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.0  # Reducido de 0.1 para evitar colapso inicial

  warmup_ratio: 0.1
  scheduler_type: "plateau"
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 1.0e-4
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

  early_stopping_patience: 15
  save_top_k: 3

evaluation:
  batch_size: 4

compute:
  # Data Pipeline optimizado para PCIe x8 (RTX 4060)
  num_workers: 4  # Ajustar según núcleos físicos del CPU (recomendado: núcleos físicos)
  pin_memory: true  # Esencial para DMA (Direct Memory Access)
  non_blocking: true  # Transferencias no bloqueantes para paralelizar copiado y cómputo
  device: "cuda"
  # Prefetch factor para DataLoader (PyTorch 2.0+)
  prefetch_factor: 2  # Pre-cargar 2 batches por worker
  persistent_workers: true  # Mantener workers vivos entre epochs

seed: 42

logging:
  log_dir: "./logs/ablation_38"
  checkpoint_dir: "./checkpoints/ablation_38"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-38"



# Ablation Study 111: linea base de SOLO AUDIO con encoder clasico (= 71 con eGeMAPS + BiLSTM).
#
# Par del 113 para medir la ganancia de la fusion en IEMOCAP con la familia clasica.
#
# FAMILIA CLASICA (estudios 111-119; detalle en docs/ESTUDIOS_SOTA.md, seccion 11).
# Mismo modelo, misma fusion, misma cabeza, mismo optimizador de la fusion, mismos folds
# y misma seleccion que su base. Cambia SOLO el encoder de cada rama:
#   audio: descriptores acusticos por frame (openSMILE eGeMAPSv02, 25 por frame a 10 ms;
#          COVAREP opcional) -> BiLSTM 2x256 -> media y maximo sobre frames reales
#   texto: GloVe 840B 300-d congelado -> BiLSTM 2x256 -> media y maximo
# Los BiLSTM se entrenan desde cero, asi que su tasa es 1e-3 (la de 3e-5 / 2e-5 es para
# afinar un encoder preentrenado y aqui dejaria la rama sin aprender). La fusion y la
# cabeza siguen a 5e-6, como en la base.
#
# ANTES DE CORRER, una vez por corpus (escribe las rutas de model.clasico):
#   python scripts\extraer_clasicas.py --study 113 --glove <glove.840B.300d.zip>

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false   # sin prompt prosodico: es la linea base de audio puro

model:
  clasico:
    fuente: "egemaps"          # egemaps | compare | covarep (ver extraer_clasicas.py)
    audio_cache: "cache/clasicas/iemocap_egemaps.pt"
    glove_cache: "cache/clasicas/glove_iemocap.pt"
    encoder:
      d_model: 256
      lstm_hidden: 256
      lstm_layers: 2
      dropout: 0.3
      finetune_embeddings: false
  modality: audio
  audio_encoder: "clasico:lld"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  # Estas tres tasas, hasta ahora, eran letra muerta en este estudio.
  use_param_groups: true   # <-- EL UNICO CAMBIO frente al 66
  learning_rate_audio: 1.0e-3
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_111"
  checkpoint_dir: "./checkpoints/ablation_111"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-111"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


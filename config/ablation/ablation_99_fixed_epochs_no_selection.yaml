# Ablation Study 99: el 74 SIN seleccion de modelo por validacion (epocas fijas).
#
# POR QUE. Chen & Rudnicky (2023) reportan 69.9 / 74.3 UA entrenando un numero FIJO de
# epocas, sin validacion y sin elegir checkpoint. Nosotros elegimos el checkpoint con
# mejor UA de validacion y paramos con early stopping. Esta fila mide cuanto vale esa
# diferencia de protocolo, para saber si la comparacion con ellos es justa.
# NO es candidata a numero principal: es una fila de sensibilidad.
#
# UN SOLO FACTOR. training.model_selection: last -> se entrenan num_epochs fijas, sin
# early stopping, y se evalua en test la ULTIMA epoca. La validacion sigue existiendo
# (la usa el scheduler de plateau), pero no elige el modelo.
#
# num_epochs = 17: la mediana de la mejor epoca de validacion de las DIEZ corridas del
# 74 (semillas 42 y 123: 12, 14, 21, 20, 8 y 17, 16, 21, 10, 32 -> mediana 16.5).
# Sale de la validacion de corridas anteriores, nunca del test. Chen & Rudnicky usan 15.
#
# Comparar contra el 74 (semilla 42), pareado por fold.
#
# LECTURA, escrita ANTES de correrlo:
#   |99 - 74| <= 0.86 -> la seleccion por validacion no infla nuestro numero: la
#                        comparacion con Chen & Rudnicky es justa en este eje.
#   74 - 99 > 0.86    -> parte de nuestro UA viene de elegir el checkpoint; se declara
#                        al lado de su fila en la tabla de estado del arte.

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: false   # sin compuerta, como el 74
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 17
  model_selection: "last"   # <-- EL UNICO CAMBIO frente al 74 (y num_epochs fijas)
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_99"
  checkpoint_dir: "./checkpoints/ablation_99"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-99"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


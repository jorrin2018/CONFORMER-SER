# Ablation Study 53: Same setup as checkpoint ablation_52_20260320_174035 (config.json):
# - freeze_text_encoder: false, freeze_vision_encoder: true (differs from ablation_52 YAML in repo)
# - WavLM-base + SupCon 3 views + Conflict-Aware + ViT mel + vision SpecAugment, no waveform aug
# Plus WavLM authors' recommendation: learned softmax weights over all hidden states (embeddings + layers)
# before temporal pooling (see WavLM paper / HF WavLMModel with output_hidden_states).

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\archive (1)\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: false
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "microsoft/wavlm-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: true
  freeze_text_encoder: true
  hidden_dim: 768
  dropout: 0.2
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "lstm"
  lstm_num_layers: 2
  lstm_bidirectional: true
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 4
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400
  vision_mel_spec_augment: true
  vision_spec_augment:
    freq_mask_param: 10
    time_mask_param: 40
  wavlm_weighted_hidden_states: true

training:
  batch_size: 8
  num_epochs: 100
  gradient_accumulation_steps: 4
  mixed_precision: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-4
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
    use_contrastive_loss: true
    contrastive_weight: 0.1
    contrastive_temperature: 0.1
  warmup_ratio: 0.1
  scheduler_type: "cosine_with_warmup"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 8

logging:
  log_dir: "./logs/ablation_53"
  checkpoint_dir: "./checkpoints/ablation_53"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-53"

compute:
  num_workers: 4
  pin_memory: true
  device: "cuda"

seed: 42

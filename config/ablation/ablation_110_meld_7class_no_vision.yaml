# Ablation Study 110: MELD a SIETE clases sin la rama ViT (el 81 con vision_stream: off).
#
# POR QUE. La literatura de MELD reporta WEIGHTED F1 sobre las 7 clases; el 79/106 corren
# a 4 clases por consistencia con IEMOCAP y CREMA-D y NO son comparables. El 81 da esa
# fila con el modelo de tres flujos; como el modelo del articulo es el 98 (sin ViT), la
# fila comparable tiene que salir sin ViT. El par es el 82 (solo audio, 7 clases).
#
# UN SOLO FACTOR frente al 81: model.vision_stream: off.
#   python scripts\run_ablation.py --study 110 --protocol fixed --seed 42 --device cuda
#   python scripts\run_ablation.py --study 110 --protocol fixed --seed 123 --device cuda
#
# Metricas a reportar: weighted F1 (la de la literatura), macro-F1 y F1 por clase. La
# exactitud no: neutral es ~48 % del test.
#
# LECTURA: no hay prediccion de signo frente al estado del arte. Se espera 110 - 82 > 0 y
# del orden del aporte a 4 clases; es la fila que permite comparar en MELD, nada mas.

dataset:
  corpus: "meld"
  # Carpeta MELD: la que contiene MELD-RAW/MELD.Raw/ y, tras correr el extractor,
  # audio_16k/. AJUSTAR A TU RUTA.
  data_path: "D:\\DOCTORADO\\DATASETS\\MELD"
  emotions:
    - angry
    - happy
    - sad
    - neutral
    - disgusted
    - fearful
    - surprised
  # "session" = SPLIT OFICIAL, no sesion ni grupo de actores: 1=train, 2=dev, 3=test.
  # MELD trae un reparto fijo, asi que esto NO rota: hay que correr con
  # --protocol fixed, que usa estas tres listas tal cual y hace UN solo fold.
  # El reparto NO es independiente de hablante (los seis protagonistas estan en los
  # tres splits); ver el encabezado y REWRITE_NOTES seccion 12.
  all_sessions: [1, 2, 3]
  train_sessions: [1]
  val_sessions: [2]
  test_sessions: [3]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 7
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: false   # sin compuerta
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_stream: "off"   # <-- EL UNICO CAMBIO frente al 81
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_110"
  checkpoint_dir: "./checkpoints/ablation_110"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-110"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


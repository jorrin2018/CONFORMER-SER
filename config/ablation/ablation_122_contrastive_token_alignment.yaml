# Ablation Study 122: el 120 con alineacion por token (co-atencion frames <-> tokens del 101).
#
# MGCMA combina alineacion por token y contrastiva. La co-atencion sola no aporto (101,
# -0.04 pp); aqui se prueba junto con la perdida. Comparar 122 - 120 (efecto de la
# co-atencion con perdida) y 122 - 98 (los dos juntos).
# ANTES DE CORRER: si el 121 gano al 120, cambia el bloque alineacion por el del 121.
#
# ALINEACION CONTRASTIVA AUDIO-TEXTO (estudios 120-122; docs/ESTUDIOS_SOTA.md, seccion 12).
# Motivo: MGCMA (2024) atribuye +2.6 pp UA a sus modulos de alineacion (77.62 -> 80.24,
# wav2vec 2.0 base + BERT base). En CAMF la co-atencion sin perdida (101) dio -0.04 pp;
# lo que falta probar es la perdida contrastiva.
# Un factor: el modulo de alineacion (cabezas de proyeccion + perdida + su peso + su tasa).
# La perdida solo existe en entrenamiento; validacion, test y seleccion no cambian.
# Comparar contra el 98 con 3 semillas por lado (42, 123, 456), pareado por fold:
#   python scripts\comparar_estudios.py 122 98 --semillas 42 123 456

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: false   # sin compuerta, como el 74
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_stream: "off"
  alineacion:              # <-- EL CAMBIO frente al 98
    enabled: true
    tipo: "memoria"         # InfoNCE audio <-> texto, negativos del batch + cola
    dim: 128
    temperatura: 0.07       # la de MGCMA
    memoria: 512            # vectores de batches anteriores (cola FIFO)
  crossmodal_attention:    # <-- EL CAMBIO frente al 120 (la co-atencion del 101)
    enabled: true
    num_heads: 8
    num_layers: 1
    dropout: 0.1
    ffn_mult: 2
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  learning_rate_alignment: 1.0e-4   # cabezas de proyeccion nuevas
  learning_rate_crossmodal: 1.0e-4   # capas de co-atencion (como el 101)
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
    contrastive_weight: 0.1   # peso de la perdida de alineacion
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_122"
  checkpoint_dir: "./checkpoints/ablation_122"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-122"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


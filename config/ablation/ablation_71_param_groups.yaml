# Ablation Study 71: el estudio 66 con el regimen de tasas que el articulo describe.
#
# UN SOLO FACTOR cambiado respecto del 66: training.use_param_groups.
#
# QUE SE DESCUBRIO (17/09/2026). create_ablation_optimizer() en
# src/ablation_studies/utils.py tiene dos ramas. Los estudios que no aparecen en
# studies_with_separate_lr caen en la rama 'else', cuyo comentario dice "encoders
# frozen". Esa suposicion es FALSA para los estudios 44, 45 y 66-69, que descongelan
# 6 bloques de wav2vec2 (y 4 de DistilBERT en el trimodal). En ellos, TODO lo
# entrenable se entreno con UNA sola tasa = learning_rate_fusion = 5e-6, y
# learning_rate_audio (3e-5) y learning_rate_text (2e-5) NUNCA se aplicaron.
#
# O sea: el regimen de entrenamiento diferencial que describe el articulo no se ha
# ejecutado nunca en las corridas que dieron los numeros. Afecta tambien al 45, que
# es el numero principal del trimodal (70.73).
#
# Explica ademas los tres nulos anteriores de forma coherente: a 5e-6 uniforme, la
# cabeza apenas entrena (por eso quitarle 10 M de parametros en el 69 no movio nada)
# y los 13 logits de capa apenas se separan del uniforme (por eso el 68 dio 0.13 pp).
#
# POR QUE UNA BANDERA Y NO ANADIR 66 A LA LISTA: anadir estudios a esa tupla
# cambiaria en silencio el comportamiento de corridas ya hechas y las volveria
# irreproducibles. La bandera queda escrita en el config.json de cada fold, asi que
# cualquiera puede ver desde el checkpoint que regimen se uso.
#
# Comparar SOLO contra el 66 (63.93 +- 2.68), pareado por fold.
#
# Verificar ANTES de lanzar:  python scripts/report_optimizer.py --study 71
# Debe imprimir tres grupos (audio 3e-5 / texto 2e-5 / fusion 5e-6), no uno.

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false   # sin prompt prosodico: es la linea base de audio puro

model:
  modality: audio
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  # Estas tres tasas, hasta ahora, eran letra muerta en este estudio.
  use_param_groups: true   # <-- EL UNICO CAMBIO frente al 66
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_71"
  checkpoint_dir: "./checkpoints/ablation_71"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-71"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


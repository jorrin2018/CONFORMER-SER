# Ablation Study 86: SOLO AUDIO sobre RAVDESS, 4 clases.
#
# QUE PREGUNTA RESPONDE. Es el par del 85 y la mitad que cierra la replica del extremo
# "texto nulo" del eje. El contraste 85-86 mide cuanto aporta la fusion cuando el texto
# son DOS frases fijas, que es el control mas limpio del articulo.
#
# LA PREDICCION, escrita ANTES de correrlo: delta indistinguible de cero. El motivo es
# mecanico y no estadistico -- en RAVDESS la rama de texto recibe una de dos cadenas
# posibles, sin relacion con la emocion, y la rama de vision es una imagen log-mel
# DERIVADA del audio, asi que tampoco anade informacion que el audio no tenga ya. Luego
# "trimodal" aqui es audio + vision redundante + texto vacio.
#
# QUE SERIA UN PROBLEMA, y conviene tenerlo escrito de antemano: si el delta sale
# POSITIVO y fuera del IC, significa que la ganancia de la fusion NO es lexica y que el
# eje mide otra cosa (capacidad del modelo, regularizacion por mas parametros, ruido).
# Eso obligaria a replantear la explicacion, no a esconder el resultado.
#
# LO QUE CAMBIA FRENTE AL 85: se quita la rama de texto. Igual que el 78 frente al 77.
#
# COMO SE CORRE:
#   python scripts/run_ablation.py --study 86 --loso
#
# ANTES DE LANZAR, OBLIGATORIO (el corpus no estaba en disco el 20/10/2026):
#   1. Descargar Audio_Speech_Actors_01-24.zip de https://zenodo.org/records/1188976
#      y descomprimir en D:/DOCTORADO/DATASETS/RAVDESS/.
#   2. python scripts/check_ravdess.py --data-path "D:/DOCTORADO/DATASETS/RAVDESS" --fase todo
#
# Las advertencias del corpus son las del 85: solo habla (no canto), `calm` excluida,
# neutral a la mitad que las otras tres (96 frente a 192, no hay neutral-strong), 672
# utterances de 4 clases en total, particion de actores propia 6/6/4/4/4, 48 kHz
# remuestreado a 16 kHz y licencia CC BY-NC-SA 4.0. Ver el encabezado del 85 y el
# docstring de src/data/ravdess_dataset.py.

dataset:
  corpus: "ravdess"                     # <-- EL UNICO CAMBIO de corpus
  # Raiz de RAVDESS: la carpeta con Actor_01/ ... Actor_24/, o bien
  # Audio_Speech_Actors_01-24/Actor_01/... NO esta en disco a 2026-10-20.
  data_path: "D:\\DOCTORADO\\DATASETS\\RAVDESS"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  # "session" = GRUPO DE ACTORES. Los 24 actores en 5 grupos disjuntos estratificados
  # por sexo, semilla fija. El MISMO reparto que el estudio 85, asi que el par 85/86 es
  # pareado fold a fold. 24 no es divisible por 5: los grupos salen 6/6/4/4/4, asi que
  # los folds NO pesan lo mismo. El sexo se deduce del identificador (impar=hombre,
  # par=mujer), que es parte del diseno publicado: no hace falta CSV de demografia.
  all_sessions: [1, 2, 3, 4, 5]
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false   # sin prompt prosodico: es la linea base de audio puro

model:
  modality: audio
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  # Estas tres tasas, hasta ahora, eran letra muerta en este estudio.
  use_param_groups: true   # <-- EL UNICO CAMBIO frente al 66
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_86"
  checkpoint_dir: "./checkpoints/ablation_86"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-86"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


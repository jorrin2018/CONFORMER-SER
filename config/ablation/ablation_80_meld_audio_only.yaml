# Ablation Study 80: SOLO AUDIO sobre MELD, 4 clases.
#
# QUE PREGUNTA RESPONDE. Es el par del 79 y la replica del claim central del articulo
# en el tercer corpus. El contraste 79-80 mide cuanto aporta la fusion sobre solo
# audio en el regimen TEXTO-DOMINANTE, frente al 77-78 que lo midio en el regimen
# TEXTO-NULO y al 72/74-71 que lo midio en IEMOCAP.
#
# LA PREDICCION, escrita ANTES de correrlo para que no se pueda racionalizar despues:
# si el aporte de la fusion es lexico, aqui el delta 79-80 debe ser GRANDE -- mayor
# que el +6.49 de IEMOCAP --, porque MELD es el corpus donde el texto mas domina. Si
# saliera nulo como en CREMA-D, la explicacion lexica se cae y hay que replantear la
# seccion 11.
#
# LA LITERATURA DA EL ORDEN DE MAGNITUD ESPERADO: audio-only en MELD tiene techo duro
# en 38-55 weighted F1 (openSMILE 38-42; wav2vec2-XLS-R-2B, SALMONN y Qwen2-Audio
# 49-55), frente a 56-64 de texto-only. Nuestro numero de 4 clases no es comparable
# con esos de 7, pero el ORDEN del efecto si lo es.
#
# LO QUE CAMBIA FRENTE AL 71: solo el corpus, su ruta y el reparto. `modality: audio`
# y las tasas por grupos de parametros vienen del 71 tal cual.
#
# COMO SE CORRE -- NO ES LOSO:
#   python scripts/run_ablation.py --study 80 --protocol fixed --seed 42
# Mismas semillas que el 79, para que el par este pareado.
#
# OJO AL COMPARAR: los deltas 79-80 (MELD), 77-78 (CREMA-D) y 72/74-71 (IEMOCAP) miden
# lo mismo y SON comparables entre si como efectos, aunque los niveles absolutos de
# los tres corpus no lo sean.
#
# ANTES DE LANZAR, en este orden:
#   python scripts/check_meld.py        --data-path "D:/DOCTORADO/DATASETS/MELD" --fase todo
#   python scripts/extract_meld_audio.py --data-path "D:/DOCTORADO/DATASETS/MELD"

dataset:
  corpus: "meld"                        # <-- EL UNICO CAMBIO de corpus
  # Carpeta MELD: la que contiene MELD-RAW/MELD.Raw/ y, tras correr el extractor,
  # audio_16k/. AJUSTAR A TU RUTA.
  data_path: "D:\\DOCTORADO\\DATASETS\\MELD"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  # "session" = SPLIT OFICIAL, no sesion ni grupo de actores: 1=train, 2=dev, 3=test.
  # MELD trae un reparto fijo, asi que esto NO rota: hay que correr con
  # --protocol fixed, que usa estas tres listas tal cual y hace UN solo fold.
  # El reparto NO es independiente de hablante (los seis protagonistas estan en los
  # tres splits); ver el encabezado y REWRITE_NOTES seccion 12.
  all_sessions: [1, 2, 3]
  train_sessions: [1]
  val_sessions: [2]
  test_sessions: [3]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false   # sin prompt prosodico: es la linea base de audio puro

model:
  modality: audio
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  # Estas tres tasas, hasta ahora, eran letra muerta en este estudio.
  use_param_groups: true   # <-- EL UNICO CAMBIO frente al 66
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_80"
  checkpoint_dir: "./checkpoints/ablation_80"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-80"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


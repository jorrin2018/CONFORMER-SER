# Ablation Study 105: CREMA-D sin la rama ViT (el 77 con model.vision_stream: off).
#
# POR QUE. El estudio 98 mostro que en IEMOCAP el ViT no aporta (98 - 74 = +0.95 +- 1.02,
# 0/5 folds en que el 74 gane por mas de 0.86). El eje lexico del articulo (CREMA-D /
# IEMOCAP / MELD) se midio con el modelo de TRES flujos; si el modelo pasa a ser el 98,
# el eje tiene que medirse con el mismo modelo. Ademas, el par 105 / 77 es la ablacion
# del ViT en un segundo corpus.
#
# UN SOLO FACTOR frente al 77: model.vision_stream: off.
# Comparar: 105 - 77 (ablacion del ViT en CREMA-D) y 105 - 78 (aporte de la fusion
# audio + texto en CREMA-D, el punto del eje), pareados por grupo de actores.
#
# LECTURA, escrita ANTES de correrlo: se espera 105 - 78 ~ 0 (el texto de CREMA-D no
# informa). Si 77 - 105 > 0.86 en >= 4/5 folds, el ViT aporta en CREMA-D: se reporta.

dataset:
  corpus: "cremad"
  # Raiz del repositorio de CREMA-D: la carpeta que contiene AudioWAV/ y
  # VideoDemographics.csv. AJUSTAR A TU RUTA.
  data_path: "D:\\DOCTORADO\\DATASETS\\CREMA-D"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  # "session" aqui significa GRUPO DE ACTORES, no sesion diadica: CREMA-D no las tiene.
  # Los 91 actores se reparten en 5 grupos disjuntos estratificados por sexo, con
  # semilla fija (src/data/cremad_dataset.py). Sigue siendo independiente de hablante.
  all_sessions: [1, 2, 3, 4, 5]
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: false   # sin compuerta
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_stream: "off"   # <-- EL UNICO CAMBIO frente al 77
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_105"
  checkpoint_dir: "./checkpoints/ablation_105"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-105"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


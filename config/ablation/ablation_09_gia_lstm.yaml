# Ablation Study 09: Unfreeze Encoders + GIA Fusion + LSTM Head
# Base config from checkpoint 20251029_190659
# Combines partially unfrozen encoders (Ablation 01),
# GIA fusion block, and an LSTM classification head (Ablation 02).

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\archive (1)\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: false
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1

model:
  # Encoder configuration (same as Ablation 05)
  freeze_audio_encoder: false
  audio_unfreeze_last_n_layers: 4
  freeze_text_encoder: false
  text_unfreeze_last_n_layers: 2

  # LSTM classification head (same as Ablation 05)
  classification_head_type: "lstm"
  lstm_num_layers: 2
  lstm_bidirectional: true

  # Other model settings
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  hidden_dim: 192
  dropout: 0.35
  num_classes: 4
  fusion_type: "gia"  # Use the new GIA fusion module
  fusion_num_heads: 4  # Number of attention heads for GIA/cross-attention fusion

training:
  learning_rate_audio: 5.0e-7
  learning_rate_text: 1.0e-6
  learning_rate_fusion: 3.0e-5
  batch_size: 2
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: true
  weight_decay: 0.15
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  loss:
    type: "focal"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "cosine"
  early_stopping_patience: 10
  save_top_k: 3

evaluation:
  batch_size: 4

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42

logging:
  log_dir: "./logs/ablation_09"
  checkpoint_dir: "./checkpoints/ablation_09"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-09"



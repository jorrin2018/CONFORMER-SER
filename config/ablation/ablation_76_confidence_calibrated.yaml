# Ablation Study 76: la confianza de la compuerta, ENTRENADA CON UN OBJETIVO.
#
# DE DONDE SALE. El estudio 75 arreglo el detector de conflicto (los tres
# clasificadores por rama ya reciben gradiente via aux_loss_weight) y aun asi no
# mejoro: 75.39 +- 3.38 frente a 75.57 +- 3.06 del 74 sin compuerta; pareado
# -0.18 +- 1.14, t(4) = -0.36, IC 95 % [-1.59, +1.23]. El mecanismo funciona y no
# aporta. El diagnostico del 22/09/2026 sobre los checkpoints validos del 75 dice
# por que:
#
#   tasa de conflicto        81.6 %   (era 94.5 % con el detector roto)
#   una rama al azar         48.9 %
#   voto uniforme            70.5 %   <-- lo que hace la compuerta desactivada
#   elegir por confianza     69.0 %   <-- lo que hace la compuerta activada
#   oraculo (alguna acierta) 91.7 %
#
# Hay 21.2 pp de margen entre el voto uniforme y el oraculo. La confianza SI informa
# (+20.1 pp sobre el 48.9 % del azar) pero seleccionar por ella pierde 1.5 pp contra
# promediar. Esa es la razon exacta de que el 75 no ganara nada.
#
# POR QUE ESTO ES ATACABLE. La confidence_net emite tres sigmoides y su unica senal
# de entrenamiento es la perdida final de clasificacion. NADA la empuja a predecir
# que rama acierta; que aun asi bata al azar por 20 pp es casi un accidente. Este
# estudio le pone el objetivo explicito: entropia cruzada binaria de cada sigmoide
# contra si el argmax de esa rama coincide con la etiqueta.
#
# QUE CAMBIA AQUI, y es UN SOLO FACTOR frente al 75: conf_loss_weight > 0.
# El peso 0.3 iguala al de la auxiliar y NO esta ajustado. Declararlo asi.
#
# QUE ESPERAR:
#   76 > 75 y 76 > 74 -> la seleccion por confianza calibrada captura parte del
#                        margen de oraculo. Es la contribucion del articulo.
#   76 = 74           -> el reponderado por confianza no supera al promedio
#                        uniforme ni con la confianza entrenada. Resultado negativo
#                        limpio, con mecanismo medido y margen de oraculo
#                        cuantificado: sigue siendo publicable, pero el articulo se
#                        escribe como diagnostico, no como metodo.
#
# Verificar ANTES:  python scripts/check_aux_integration.py
# Comparar pareado contra el 75 (75.39 +- 3.38) Y contra el 74 (75.57 +- 3.06).

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    aux_loss_weight: 0.3   # igual que el 75
    conf_loss_weight: 0.3  # <-- EL UNICO CAMBIO frente al 75
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true   # <-- EL UNICO CAMBIO
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_76"
  checkpoint_dir: "./checkpoints/ablation_76"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-76"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


# Ablation Study 13a (Study 14): Regularized version of Ablation 13
# Base conceptual: Ablation 13 (Tri-modal + ViT unfreezing + SpeechCue)
# Modificaciones vs Ablation 13:
#   - model.vision_unfreeze_last_n_layers: 2 (antes 6) -> Menos params entrenables
#   - model.dropout: 0.4 (antes 0.3) -> Mayor regularización
#   - training.loss.label_smoothing: 0.05 (antes 0.0) -> Evitar logits extremos
#   - training.learning_rate_fusion: 5.0e-6 (antes 1.0e-5) -> Ajuste más fino
#
# Objetivo: Reducir el sobreajuste observado en Ablation 13 y mejorar la generalización.

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\archive (1)\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: false
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  # Activar prompts internos de prosodia tipo SpeechCue
  use_prosody_cues: true

model:
  # Encoders audio/text
  freeze_audio_encoder: false
  audio_unfreeze_last_n_layers: 6
  freeze_text_encoder: false
  text_unfreeze_last_n_layers: 4

  # Cabeza de clasificación LSTM
  classification_head_type: "lstm"
  lstm_num_layers: 2
  lstm_bidirectional: true

  # Backbones base
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  hidden_dim: 256
  dropout: 0.4   # AUMENTADO (antes 0.3)
  num_classes: 4

  # Fusión trimodal basada en cross-attention
  fusion_type: "cross_attention"
  fusion_num_heads: 4

  # Rama visual (Mel-espectrograma -> imagen -> ViT)
  vision_encoder: "google/vit-base-patch16-224"
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 2  # REDUCIDO (antes 6)
  vision_image_size: 224

  # Parámetros de mel específicos para la rama visual
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  learning_rate_audio: 3.0e-7
  learning_rate_text: 1.5e-6
  learning_rate_fusion: 5.0e-6  # REDUCIDO (antes 1.0e-5)

  batch_size: 2
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  weight_decay: 0.05
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.05  # AUMENTADO (antes 0.0)

  warmup_ratio: 0.1
  scheduler_type: "plateau"
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 1.0e-4
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

  early_stopping_patience: 15
  save_top_k: 3

evaluation:
  batch_size: 4

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42

logging:
  log_dir: "./logs/ablation_13a"
  checkpoint_dir: "./checkpoints/ablation_13a"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-13a"




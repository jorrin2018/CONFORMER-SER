# Ablation Study 94: CAMF tal como lo describe la presentacion
#
# Serie 87-94: alinear el codigo con la presentacion (CAMF_presentacion_1.pptx).
# Base: estudio 72 (CAMF con tasas por grupo). COMBINACION (no es fila de ablacion): 88 + 90 + 91 + 93 sobre el 72. El ViT se deja CONGELADO, como el 72 y la diapo 30; para la variante afinada ver el 92.
#
# Que dice la presentacion: SpeechCue de tokens con tasa de alineacion forzada, pooling y log-mel sobre el enunciado real, [CLS] del ViT y pitch shift real.
# Que hacia el codigo:      ver los estudios 87-93.
#
# Comparar POR FOLD contra el estudio 72, mismo protocolo (--loso --protocol standard)
# y misma semilla. Banda de ruido de re-ejecucion: +-0.86 pp (REWRITE_NOTES sec. 7):
# una diferencia pareada menor no es atribuible al cambio.
#
# Verificar ANTES de lanzar:
#   python scripts\report_optimizer.py --study 94
#   python scripts\check_deck_variants.py --study 94
#   python scripts\check_forced_alignment.py
#   python scripts\fit_speechcue_stats.py --rate-source forced_alignment

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  pad_after_preprocessing: true   # aumento y normalizacion sobre el enunciado real
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]
    pitch_shift_impl: torchaudio   # pitch shift REAL (el historico no aplica nada)

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false        # el prompt en lenguaje natural del 72 queda desactivado
  speechcue:
    enabled: true
    stats_cache: "cache/speechcue_stats_fa.json"
    normalize: global            # terciles globales, como la Ec. 4 de la presentacion
    rate_source: forced_alignment   # tasa silabica desde los .syseg de IEMOCAP

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  audio_masked_pooling: true    # Ec. 1: promedio de los T' frames reales
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  vision_feature: cls            # Ec. 3: [CLS], no el pooler sin pesos
  vision_mel_speech_only: true  # Ec. 2-3: log-mel del enunciado real, sin relleno
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true   # <-- EL UNICO CAMBIO
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_94"
  checkpoint_dir: "./checkpoints/ablation_94"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-94"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


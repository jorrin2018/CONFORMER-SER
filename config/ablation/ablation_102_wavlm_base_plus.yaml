# Ablation Study 102: el 74 con WavLM Base+ en lugar de wav2vec 2.0 base.
#
# POR QUE. La rama de audio es la palanca mas grande: nuestro solo-audio da 68.99 UA y
# Morais et al. 2022 (solo audio, dos encoders afinados) 77.76. En SUPERB (encoder
# congelado), con el MISMO tamano (~95 M), WavLM Base+ saca 68.65 en ER frente a 63.43 de
# wav2vec 2.0 base: +5.2 pp (Chen et al. 2022, arXiv:2110.13900). Los modelos Large
# (317 M) probablemente no caben con este regimen en una RTX 3070.
#
# UN SOLO FACTOR. model.audio_encoder: microsoft/wavlm-base-plus. Mismo numero de capas
# (12), misma politica de afinado (6 bloques superiores), mismas tasas.
#
# OJO: wavlm-base-plus solo publica .bin; con torch < 2.6 transformers se niega a leerlo
# (CVE-2025-32434). El cargador falla con un mensaje claro en vez de seguir con pesos
# aleatorios.
#
# Comparar contra el 74 (semilla 42), pareado por fold. Para atribuir la ganancia a la
# rama de audio, correr tambien la linea base solo-audio con WavLM (pendiente: 71 con el
# mismo cambio) si el 102 gana.
#
# LECTURA, escrita ANTES de correrlo:
#   102 - 74 > 0.86 en >= 4/5 folds -> el encoder de audio limita; adoptarlo.
#   |102 - 74| <= 0.86 -> la ventaja de WavLM en SUPERB (congelado) no se transporta
#                        al afinado parcial con fusion.

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "microsoft/wavlm-base-plus"   # <-- EL UNICO CAMBIO frente al 74
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: false   # sin compuerta, como el 74
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_102"
  checkpoint_dir: "./checkpoints/ablation_102"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-102"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


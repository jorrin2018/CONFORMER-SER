# Ablation Study 69: estudio 66 + cabeza simple (Pepino et al.).
#
# UN SOLO FACTOR cambiado respecto del 66: classification_head_type.
#
# Por que: la cabeza MultiScaleTemporal recibe un vector (B, D), no una secuencia --
# en UnimodalBaselineModel.forward el audio ya se promedio sobre el tiempo. Sobre una
# secuencia de longitud 1 sus tres "pooling types" devuelven tres casi-copias del
# mismo vector ("mean" y "max" son identicos; "attention" con una sola clave es una
# proyeccion lineal). Ese (B, 3, D) de duplicados alimenta un BiLSTM de 2 capas x 512
# mas una self-attention: 9,988,868 parametros, el 19 % de los entrenables, modelando
# la dinamica temporal de tres copias de un vector.
#
# Pepino et al. colapsan el tiempo igual que nosotros, pero encima ponen una densa y
# reportan 72.50 UA con el mismo encoder. Nuestra linea base da 63.93. Esta corrida
# mide si esos 10 M de parametros redundantes son el cuello de botella.
#
# Hipotesis: si sube, el techo lo ponia la cabeza y la correccion se aplica igual al
# trimodal (estudio 45 instala la misma cabeza sobre el vector 'fused' de la fusion).
# Si no sube, toca barrido de lr y regularizacion.
#
# Lectura obligada: comparar SOLO contra el 66 (63.93 +- 2.68), pareado por fold.

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: false   # sin prompt prosodico: es la linea base de audio puro

model:
  modality: audio
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "simple"   # <-- EL UNICO CAMBIO frente al 66
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: true
  vision_unfreeze_last_n_layers: 0
  vision_image_size: 224
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_69"
  checkpoint_dir: "./checkpoints/ablation_69"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-69"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


# Ablation Study 92: ViT con los bloques 9-12 afinados
#
# Serie 87-94: alinear el codigo con la presentacion (CAMF_presentacion_1.pptx).
# Base: estudio 72 (CAMF con tasas por grupo). UN SOLO FACTOR frente al 91: los 4 bloques superiores del ViT + LayerNorm final entrenables (a learning_rate_fusion, 5e-6: la presentacion no da tasa para el ViT).
#
# Que dice la presentacion: patch embedding y bloques 1-8 congelados, 9-12 y LayerNorm final afinados (Fig. 2, diapo 14, Tabla 13: 28.35 M entrenables). OJO: la misma presentacion dice tambien "ViT congelado" (diapos 14 y 30).
# Que hacia el codigo:      ViT completamente congelado (0 / 86.4 M entrenables).
#
# Comparar POR FOLD contra el estudio 91, mismo protocolo (--loso --protocol standard)
# y misma semilla. Banda de ruido de re-ejecucion: +-0.86 pp (REWRITE_NOTES sec. 7):
# una diferencia pareada menor no es atribuible al cambio.
#
# Verificar ANTES de lanzar:
#   python scripts\report_optimizer.py --study 92
#   python scripts\check_deck_variants.py --study 92

dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  emotions:
    - angry
    - happy
    - sad
    - neutral
  train_sessions: [1, 2, 3]
  val_sessions: [4]
  test_sessions: [5]
  sample_rate: 16000

audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: true
    time_mask_prob: 0.5
    time_mask_max: 4000
    num_time_masks: 1
    noise_prob: 0.3
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.3
    speed_range: [0.9, 1.1]
    pitch_prob: 0.2
    pitch_range: [-2, 2]

text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false
    mask_prob: 0.15
    insert_prob: 0.1
  use_prosody_cues: true

model:
  audio_encoder: "facebook/wav2vec2-base"
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: false
  freeze_text_encoder: false
  hidden_dim: 512
  dropout: 0.5
  num_classes: 4
  fusion_type: "conflict_aware_cross_attention"
  audio_unfreeze_last_n_layers: 6
  text_unfreeze_last_n_layers: 4
  classification_head_type: "multi_scale_temporal"
  classification_head:
    use_temporal_pooling: true
    pooling_types: ["mean", "max", "attention"]
    use_lstm: true
    lstm_num_layers: 2
    lstm_bidirectional: true
    lstm_hidden: 512
    lstm_dropout: 0.3
    use_self_attention: true
    attention_heads: 4
    final_dropout: 0.4
  fusion_num_heads: 8
  fusion_num_layers: 3
  conflict_aware:
    enabled: true
    conflict_detection_method: "prediction_divergence"
    conflict_threshold: 0.3
    confidence_weighting: true
    conflict_resolution: "confidence_weighted"
  vision_encoder: "google/vit-base-patch16-224"
  # El articulo describe el ViT congelado, y la corrida que dio 79.23 UA lo tenia
  # congelado en su config.json. Descongelarlo cuesta 10.65 pp (ver estudio 65).
  freeze_vision_encoder: false
  vision_unfreeze_last_n_layers: 4   # bloques 9-12 + LayerNorm final (Fig. 2, Tabla 13)
  vision_image_size: 224
  vision_feature: cls            # Ec. 3: [CLS], no el pooler sin pesos
  mel_n_mels: 80
  mel_n_fft: 400
  mel_hop_length: 160
  mel_win_length: 400

training:
  batch_size: 4
  num_epochs: 100
  gradient_accumulation_steps: 8
  mixed_precision: false
  use_param_groups: true   # <-- EL UNICO CAMBIO
  learning_rate_audio: 3.0e-5
  learning_rate_text: 2.0e-5
  learning_rate_fusion: 5.0e-6
  weight_decay: 0.05
  adam_epsilon: 1.0e-08
  max_grad_norm: 1.0
  loss:
    type: "cross_entropy"
    gamma: 2.0
    label_smoothing: 0.1
  warmup_ratio: 0.1
  scheduler_type: "plateau"
  early_stopping_patience: 8
  save_top_k: 3
  scheduler_metric: "val_loss"
  scheduler_mode: "min"
  scheduler_factor: 0.5
  scheduler_patience: 3
  scheduler_threshold: 0.0001
  scheduler_min_lr: 1.0e-7
  scheduler_cooldown: 1
  scheduler_verbose: true

evaluation:
  batch_size: 4

logging:
  log_dir: "./logs/ablation_92"
  checkpoint_dir: "./checkpoints/ablation_92"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser-ablation-92"

compute:
  num_workers: 2
  pin_memory: true
  device: "cuda"

seed: 42


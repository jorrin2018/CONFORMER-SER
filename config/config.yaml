# IEMOCAP Conformer SER Configuration

# Dataset
dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\archive (1)\\IEMOCAP_full_release"
  # Emotion labels (10 categories)
  emotions:
    - angry
    - happy
    - sad
    - neutral
    - frustrated
    - excited
    - fearful
    - surprised
    - disgusted
    - other
  # Split estándar para IEMOCAP (solo hay 5 sesiones)
  train_sessions: [1, 2, 3]      # 3 sesiones para entrenamiento
  val_sessions: [4]               # 1 sesión para validación
  test_sessions: [5]              # 1 sesión para test
  sample_rate: 16000

# Audio preprocessing
audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 8  # seconds (reduced to save GPU memory)
  # Waveform augmentation for raw audio (Wav2Vec2/Conformer)
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true
    apply_freq_masking: true  # Enable frequency masking
    apply_noise: true
    apply_speed_perturb: true
    apply_pitch_shift: false  # Disabled by default (requires torchaudio >= 0.9.0)
    time_mask_prob: 0.3
    time_mask_max: 3200  # ~0.2s at 16kHz
    num_time_masks: 2
    freq_mask_prob: 0.2  # Add frequency masking probability
    freq_mask_max: 10   # Add max frequency bands to mask
    num_freq_masks: 2    # Add number of frequency masks
    noise_prob: 0.15
    noise_snr_min: 10.0
    noise_snr_max: 30.0
    speed_prob: 0.2
    speed_range: [0.9, 1.1]  # ±10%
    pitch_prob: 0.2
    pitch_range: [-2, 2]  # semitones

# Text preprocessing
text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  # Text augmentation
  apply_text_augment: false
  augmentation:
    apply_random_mask: true
    apply_random_insert: false  # More aggressive, disabled by default
    mask_prob: 0.15
    insert_prob: 0.1

# Model architecture (optimized for 8GB GPU)
model:
  audio_encoder: "facebook/wav2vec2-base"  # Smaller model for 8GB GPU
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: True  # Freeze base, unfreeze last N layers for fine-tuning
  audio_unfreeze_last_n_layers: 4  # Unfreeze top N transformer layers for fine-tuning
  freeze_text_encoder: True   # Keep text encoder frozen
  hidden_dim: 256  # Reduced from 512 to save memory
  dropout: 0.2  # Moderate regularization (was 0.3, too high)
  num_classes: 10
  fusion_type: "cross_attention"  # Options: concat, cross_attention

# Training (optimized for 8GB GPU)
training:
  batch_size: 2  # Reduced from 16 for 8GB GPU
  num_epochs: 100
  gradient_accumulation_steps: 8  # Simulates effective batch_size=16
  mixed_precision: true
  
  # Optimizer
  learning_rate_audio: 1.0e-4   # LR for unfrozen wav2vec2 layers (4 top layers)
  learning_rate_text: 2.0e-5    # LR for text encoder (currently frozen)
  learning_rate_fusion: 2.0e-3  # Higher LR for fusion/classification head (new layers)
  weight_decay: 0.01            # Light regularization to start
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  
  # Loss function
  loss:
    type: "cross_entropy"  # Start with simple cross_entropy, can switch to focal later
    gamma: 2.0  # Focal loss focusing parameter (not used for cross_entropy)
    label_smoothing: 0.1  # Enabled to reduce overconfidence
  
  # Scheduler
  warmup_ratio: 0.1  # 10% warmup steps
  scheduler_type: "cosine"  # Options: linear, cosine
  
  # Early stopping
  early_stopping_patience: 15  # Increased to allow model to generalize better
  save_top_k: 3

# Evaluation
evaluation:
  batch_size: 4  # Reduced from 32 for 8GB GPU

# Logging
logging:
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser"

# Compute (optimized for 8GB GPU)
compute:
  num_workers: 2  # Reduced from 4
  pin_memory: true
  device: "cuda"  # cuda or cpu

# Reproducibility
seed: 42


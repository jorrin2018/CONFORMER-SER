# IEMOCAP Conformer SER Configuration

# Dataset
dataset:
  data_path: "D:\\DOCTORADO\\DATASETS\\IEMOCAP\\IEMOCAP_full_release"
  # Emotion labels (4 categories - happy merges happy/excited, others removed)
  emotions:
    - angry
    - happy        # happy + excited
    - sad
    - neutral
  # Split estándar para IEMOCAP (solo hay 5 sesiones)
  train_sessions: [1, 2, 3]      # 3 sesiones para entrenamiento
  val_sessions: [4]               # 1 sesión para validación
  test_sessions: [5]              # 1 sesión para test
  sample_rate: 16000

# Audio preprocessing
audio:
  n_mels: 80
  n_fft: 400
  hop_length: 160
  win_length: 400
  max_length: 10  # seconds (increased from 8 for better context, still manageable with batch_size=2)
  # Waveform augmentation for raw audio (Wav2Vec2/Conformer)
  # Only pure waveform augmentation techniques for Wav2Vec2 compatibility
  apply_waveform_augment: true
  augmentation:
    apply_time_masking: true      # Pure waveform - masks time segments
    apply_freq_masking: false      # DISABLED - requires spectrogram conversion (incompatible with Wav2Vec2)
    apply_noise: true             # Pure waveform - adds Gaussian noise
    apply_speed_perturb: true     # Pure waveform - changes speed (pitch + duration)
    apply_pitch_shift: false      # Disabled by default (requires torchaudio >= 0.9.0)
    # Time masking parameters
    time_mask_prob: 0.4           # Increased probability for stronger augmentation (was 0.3)
    time_mask_max: 4000           # Increased mask length for more aggressive augmentation (~0.25s at 16kHz)
    num_time_masks: 3            # Increased number of masks for stronger augmentation
    # Noise parameters
    noise_prob: 0.25              # Increased probability for stronger augmentation (was 0.15)
    noise_snr_min: 8.0            # Lower minimum SNR for more aggressive noise (was 10.0)
    noise_snr_max: 25.0           # Lower maximum SNR for more aggressive noise (was 30.0)
    # Speed perturbation parameters
    speed_prob: 0.3               # Increased probability for stronger augmentation (was 0.2)
    speed_range: [0.85, 1.15]     # Wider speed range for more variation (±15% instead of ±10%)
    # Pitch shift parameters (disabled)
    pitch_prob: 0.2
    pitch_range: [-2, 2]          # semitones

# Text preprocessing
text:
  model_name: "distilbert-base-uncased"
  max_length: 128
  # Text augmentation
  apply_text_augment: true  # Enabled to combat overfitting
  augmentation:
    apply_random_mask: true
    apply_random_insert: true  # Enabled for stronger augmentation
    mask_prob: 0.2  # Increased from 0.15 for stronger augmentation
    insert_prob: 0.15  # Increased from 0.1 for stronger augmentation

# Model architecture (optimized for 8GB GPU)
model:
  audio_encoder: "facebook/wav2vec2-base"  # Smaller model for 8GB GPU
  text_encoder: "distilbert-base-uncased"
  freeze_audio_encoder: False  # Freeze base, unfreeze last N layers for fine-tuning
  audio_unfreeze_last_n_layers: 8  # Unfreeze top N transformer layers for fine-tuning
  freeze_text_encoder: True   # Keep text encoder frozen
  hidden_dim: 256  # Reduced from 512 to save memory
  dropout: 0.3  # Increased to combat severe overfitting (was 0.2, still showing overfitting)
  num_classes: 4  # 4-class setting: angry, happy (happy+excited), sad, neutral
  fusion_type: "cross_attention"  # Options: concat, cross_attention

# Training (optimized for 8GB GPU)
training:
  batch_size: 2  # Reduced from 16 for 8GB GPU
  num_epochs: 100
  gradient_accumulation_steps: 8  # Simulates effective batch_size=16
  mixed_precision: false  # DISABLED - main cause of NaN gradients in audio encoder
  
  # Optimizer
  learning_rate_audio: 2.5e-7   # Further reduced to prevent overfitting (was 5.0e-7)
  learning_rate_text: 2.0e-5    # LR for text encoder (currently frozen)
  learning_rate_fusion: 5.0e-4  # Reduced to combat overfitting (was 1.0e-3, too high causing volatility)
  weight_decay: 0.05            # Increased L2 regularization to combat overfitting (was 0.01)
  adam_epsilon: 1.0e-8
  max_grad_norm: 0.5  # Less aggressive gradient clipping (prevents collapse)
  
  # Loss function
  loss:
    type: "cross_entropy"  # Start with simple cross_entropy, can switch to focal later
    gamma: 2.0  # Focal loss focusing parameter (not used for cross_entropy)
    label_smoothing: 0.0  # Disabled to prevent class collapse (was 0.1)
  
  # Scheduler
  scheduler_type: "cosine"  # Cosine with warmup prevents early collapse (better than plateau)
  warmup_ratio: 0.1  # Warmup prevents early collapse (10% of training steps)
  # Plateau scheduler parameters (when scheduler_type: "plateau")
  scheduler_metric: "val_loss"  # Metric to monitor: "val_loss" or "val_unweighted_accuracy"
  scheduler_mode: "min"  # "min" for val_loss, "max" for accuracy
  scheduler_factor: 0.5  # Reduce LR by this factor when metric plateaus
  scheduler_patience: 5  # Number of epochs with no improvement before reducing LR
  scheduler_threshold: 1e-4  # Minimum change in metric to qualify as an improvement
  scheduler_min_lr: 1.0e-7  # Minimum learning rate
  scheduler_cooldown: 2  # Number of epochs to wait before resuming normal operation after LR reduction
  scheduler_verbose: true  # Print messages when LR is reduced
  
  # Early stopping
  early_stopping_patience: 8  # Reduced to stop earlier when validation stops improving (combat overfitting)
  save_top_k: 3

# Evaluation
evaluation:
  batch_size: 4  # Reduced from 32 for 8GB GPU

# Logging
logging:
  log_dir: "./logs"
  checkpoint_dir: "./checkpoints"
  log_every_n_steps: 10
  val_every_n_epochs: 1
  use_tensorboard: true
  use_wandb: false
  project_name: "conformer-iemocap-ser"

# Compute (optimized for 8GB GPU)
compute:
  num_workers: 2  # Reduced from 4
  pin_memory: true
  device: "cuda"  # cuda or cpu

# Reproducibility
seed: 42

